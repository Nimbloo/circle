# Gate de qualidade: typecheck + lint + testes. Roda em PRs pra develop/main e em
# pushes na develop. Os testes usam PGlite (Postgres em memória) — sem serviço externo.
#
# pnpm via corepack (built-in do Node, versão pinada no packageManager do
# package.json) — a org restringe actions de terceiros (allowed: selected) e o
# pnpm/action-setup derrubava o workflow em startup_failure antes de rodar.
name: ci

on:
  pull_request:
    branches: [develop, main, master]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Enable pnpm (corepack)
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
