# Build da imagem Circle e push pro ECR (circle/prd).
# Auto-contido (OIDC -> ECR). Pode ser trocado pelo reusable
# `docker-app-pipeline` do nimbloo-cicd-templates quando o contrato for confirmado.
name: build-and-push

on:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: 967587831433.dkr.ecr.us-east-1.amazonaws.com/circle/prd

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::967587831433:role/github-sam-deployer
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          # NEXT_PUBLIC_* sao embutidos no bundle do browser em tempo de BUILD:
          # defini-los so no chart (runtime) ativaria Sentry no server/edge e deixaria
          # o cliente mudo. Variavel do repo (Settings > Variables); ausente = vazio =
          # SDK inerte, sem quebrar o build.
          build-args: |
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_CIRCLE_ENV=production
          tags: |
            ${{ env.ECR_REPOSITORY }}:${{ steps.ver.outputs.version }}
            ${{ env.ECR_REPOSITORY }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Tag git v{version} + GitHub Release (só na main/master, uma vez por versão).
      # Alinha o circle com a convenção Nimbloo de rastreabilidade de release.
      - name: Tag + GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v${{ steps.ver.outputs.version }}"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION já existe — pulando."
          else
            gh release create "$VERSION" --target "${{ github.sha }}" --title "$VERSION" --generate-notes
          fi
