# Build da imagem Circle e push pro ECR (circle/prd).
# Auto-contido (OIDC -> ECR). Pode ser trocado pelo reusable
# `docker-app-pipeline` do nimbloo-cicd-templates quando o contrato for confirmado.
name: build-and-push

on:
  push:
    branches: [master, main]
    # Alterações sem impacto no artefato não podem repontar uma tag SemVer já
    # publicada. O workflow manual continua disponível quando necessário.
    paths-ignore:
      - ".github/**"
      - "docs/**"
      - "**/*.md"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: 967587831433.dkr.ecr.us-east-1.amazonaws.com/circle/prd

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Read version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  # Um job por plataforma, cada um no runner NATIVO daquela arquitetura — sem QEMU.
  # Emulação (docker/setup-qemu-action) faria o compilador Rust do Next.js (SWC) rodar
  # sob emulação no build arm64, o gargalo conhecido (facilmente 5-10x mais lento);
  # runner nativo mantém o arm64 no mesmo patamar de tempo do amd64 hoje.
  build:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::967587831433:role/github-sam-deployer
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Push por digest (sem tag ainda) — o manifest multi-arch com as tags finais
      # (versão + sha) é criado no job "manifest", juntando os dois digests.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # NEXT_PUBLIC_* sao embutidos no bundle do browser em tempo de BUILD:
          # defini-los so no chart (runtime) ativaria Sentry no server/edge e deixaria
          # o cliente mudo. Variavel do repo (Settings > Variables); ausente = vazio =
          # SDK inerte, sem quebrar o build.
          build-args: |
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_CIRCLE_ENV=production
          outputs: type=image,name=${{ env.ECR_REPOSITORY }},push-by-digest=true,name-canonical=true,push=true
          # Cache por plataforma (escopo próprio): amd64 e arm64 não compartilham
          # layers, então uma cache única faria uma arquitetura invalidar a da outra.
          cache-from: type=gha,scope=circle-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=circle-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      # `gh release create` (último step) precisa do repo local pra resolver o alvo.
      - uses: actions/checkout@v7

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::967587831433:role/github-sam-deployer
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Junta os dois digests (amd64 + arm64) num único manifest list, publicado
      # nas MESMAS tags de sempre (versão do package.json + sha do commit).
      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            -t ${{ env.ECR_REPOSITORY }}:${{ needs.version.outputs.version }} \
            -t ${{ env.ECR_REPOSITORY }}:sha-${{ github.sha }} \
            $(printf '${{ env.ECR_REPOSITORY }}@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect ${{ env.ECR_REPOSITORY }}:${{ needs.version.outputs.version }}

      # Tag git v{version} + GitHub Release (só na main/master, uma vez por versão).
      # Alinha o circle com a convenção Nimbloo de rastreabilidade de release.
      - name: Tag + GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v${{ needs.version.outputs.version }}"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION já existe — pulando."
          else
            gh release create "$VERSION" --target "${{ github.sha }}" --title "$VERSION" --generate-notes
          fi
